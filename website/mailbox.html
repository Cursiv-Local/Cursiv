<!DOCTYPE html>
<html lang="en">
<head>












<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursiv — Mailbox</title>
<meta name="description" content="Seal a letter for another Cursiv user, or read what's been sealed for you.">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="/assets/cursiv_256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #08090C;
  --bg2:     #0D0F15;
  --bg3:     #111318;
  --border:  #1A1D2E;
  --border2: #252840;
  --gold:    #C9A227;
  --gold-dim: rgba(201,162,39,0.15);
  --silver:  #EDE8DC;
  --silver2: #9A9480;
  --green:   #27C97A;
  --red:     #FF4455;
  --mono:    'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
  --serif:   'EB Garamond', Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--silver); font-family: var(--mono); font-size: 13px; line-height: 1.6; min-height: 100vh; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); }

nav {
  position: fixed; top: 0; inset-inline: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; height: 52px;
  background: rgba(8,9,12,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--gold); font-size: 11px; font-weight: 500; letter-spacing: 3px; }
.nav-logo .hex { font-size: 18px; filter: drop-shadow(0 0 4px var(--gold)); }
.nav-links { display: flex; align-items: center; gap: 20px; }
.nav-links a { color: var(--silver2); text-decoration: none; font-size: 11px; letter-spacing: .5px; transition: color .2s; }
.nav-links a:hover, .nav-links a.active { color: var(--gold); }

main { max-width: 760px; margin: 0 auto; padding: 88px 24px 80px; }

.term-header { margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.term-title { color: var(--gold); font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: 1px; margin: 4px 0; }
.term-subtitle { color: var(--silver2); font-size: 12px; }

#gate { background: var(--bg2); border: 1px solid var(--border); padding: 22px; text-align: center; }
#gate a { color: var(--gold); }

.panel { background: var(--bg2); border: 1px solid var(--border); padding: 20px 22px; margin-bottom: 24px; }
.panel-label { color: var(--gold); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }

label { display: block; font-size: 10px; color: var(--silver2); letter-spacing: 1px; margin: 12px 0 5px; text-transform: uppercase; }
label:first-of-type { margin-top: 0; }
input[type=text], textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border2); color: var(--silver);
  font-family: inherit; font-size: 13px; padding: 10px 12px; outline: none; resize: vertical;
}
input[type=text]:focus, textarea:focus { border-color: var(--gold); }
textarea { min-height: 140px; }

button {
  font-family: inherit; cursor: pointer; border: none;
}
#send-btn {
  margin-top: 16px; padding: 12px; width: 100%;
  background: var(--gold); color: #08090C; font-weight: 600;
  font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
}
#send-btn:disabled { opacity: .5; cursor: default; }
#send-status { margin-top: 8px; font-size: 11px; color: var(--silver2); min-height: 16px; }

.tabs { display: flex; gap: 0; margin-bottom: 16px; }
.tab-btn {
  background: none; border: 1px solid var(--border2); color: var(--silver2);
  font-family: inherit; font-size: 10px; padding: 6px 16px; letter-spacing: 1px; text-transform: uppercase;
}
.tab-btn:first-child { border-right: none; }
.tab-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

.letter { border: 1px solid var(--border); background: var(--bg); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
.letter:hover { border-color: var(--border2); }
.letter.unread { border-left: 2px solid var(--gold); }
.letter-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--silver2); margin-bottom: 6px; }
.letter-subject { color: var(--silver); font-size: 13px; }
.letter-body { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--silver2); white-space: pre-wrap; display: none; }
.letter.open .letter-body { display: block; }
.empty { color: var(--silver2); font-size: 12px; padding: 12px 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/"><span class="hex">⬡</span> CURSIV</a>
  <div class="nav-links">
    <a href="/">home</a>
    <a href="/start">start here</a>
    <a href="/chat">chat</a>
    <a href="/mailbox" class="active">mailbox</a>
    <a href="/profile">profile</a>
  </div>
</nav>

<main>
  <div class="term-header">
    <div class="term-title">Mailbox</div>
    <div class="term-subtitle">Seal a letter for another Cursiv user. Only readable through the site's own key — never stored as plain text.</div>
  </div>

  <div id="gate" style="display:none;">
    Log in first — <a href="/board">go to the Board</a> to log in or register, then come back here.
  </div>

  <div id="app" style="display:none;">
    <div class="panel">
      <div class="panel-label">Write a Letter</div>
      <label for="to">To (username)</label>
      <input type="text" id="to" placeholder="their exact username">
      <label for="subject">Subject</label>
      <input type="text" id="subject" placeholder="(optional)">
      <label for="body">Letter</label>
      <textarea id="body" placeholder="Say what you came to say..."></textarea>
      <button id="send-btn">Seal &amp; Send</button>
      <div id="send-status"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="inbox">Inbox</button>
      <button class="tab-btn" data-tab="sent">Sent</button>
    </div>
    <div id="inbox-list"></div>
    <div id="sent-list" style="display:none;"></div>
  </div>
</main>

<script>
const token = localStorage.getItem('cursiv_token') || '';

if (!token) {
  document.getElementById('gate').style.display = 'block';
} else {
  document.getElementById('app').style.display = 'block';
  init();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function fmtDate(iso) {
  try { return new Date(iso + 'Z').toLocaleString(); } catch (e) { return iso; }
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) {
    localStorage.removeItem('cursiv_token');
    document.getElementById('gate').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    throw new Error('session expired');
  }
  return r;
}

function renderLetters(container, letters, mode) {
  container.innerHTML = '';
  if (!letters.length) {
    container.innerHTML = '<div class="empty">Nothing here yet.</div>';
    return;
  }
  letters.forEach(function (l) {
    const div = document.createElement('div');
    div.className = 'letter' + (mode === 'inbox' && !l.read ? ' unread' : '');
    const who = mode === 'inbox' ? ('from ' + l.from) : ('to ' + l.to);
    div.innerHTML =
      '<div class="letter-meta"><span>' + esc(who) + '</span><span>' + esc(fmtDate(l.created)) + '</span></div>' +
      '<div class="letter-subject">' + esc(l.subject || '(no subject)') + '</div>' +
      '<div class="letter-body">' + esc(l.body) + '</div>';
    div.addEventListener('click', function () {
      div.classList.toggle('open');
      if (mode === 'inbox' && !l.read) {
        l.read = true;
        div.classList.remove('unread');
        api('/api/mailbox/' + l.id + '/read', { method: 'POST' }).catch(function () {});
      }
    });
    container.appendChild(div);
  });
}

async function loadInbox() {
  const r = await api('/api/mailbox/inbox');
  const data = await r.json();
  renderLetters(document.getElementById('inbox-list'), data.letters || [], 'inbox');
}

async function loadSent() {
  const r = await api('/api/mailbox/sent');
  const data = await r.json();
  renderLetters(document.getElementById('sent-list'), data.letters || [], 'sent');
}

function init() {
  loadInbox();
  loadSent();

  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('inbox-list').style.display = tab === 'inbox' ? 'block' : 'none';
      document.getElementById('sent-list').style.display = tab === 'sent' ? 'block' : 'none';
    });
  });

  const sendBtn = document.getElementById('send-btn');
  const status  = document.getElementById('send-status');
  sendBtn.addEventListener('click', async function () {
    const to      = document.getElementById('to').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const body    = document.getElementById('body').value.trim();
    if (!to || !body) { status.textContent = 'A recipient and a letter are required.'; return; }

    sendBtn.disabled = true;
    status.textContent = 'sealing...';
    try {
      const r = await api('/api/mailbox/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to_username: to, subject: subject, body: body }),
      });
      const data = await r.json();
      if (!r.ok) {
        status.textContent = data.detail || 'Could not send.';
      } else {
        status.textContent = 'Sealed and sent.';
        document.getElementById('to').value = '';
        document.getElementById('subject').value = '';
        document.getElementById('body').value = '';
        loadSent();
      }
    } catch (e) {
      status.textContent = 'Network error — try again.';
    }
    sendBtn.disabled = false;
  });
}
</script>
</body>
</html>

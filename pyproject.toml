[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursiv"
version = "3.14"
description = "Cursiv — a private, local-first AI companion for Windows (Ollama first, free keys optional)"
authors = [{name = "Joshua Winkler"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "bcrypt>=4.1.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "Pillow>=10.3.0",
    "psutil>=5.9.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cursiv_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

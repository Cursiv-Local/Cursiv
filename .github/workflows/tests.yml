name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 anthropic openai bcrypt cryptography numpy Pillow psutil pywin32 pytest
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q
